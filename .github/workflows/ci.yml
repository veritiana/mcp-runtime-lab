name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Validate Docker build
        run: docker build -f deploy/docker/Dockerfile -t mcp-runtime-lab:ci .
      - name: Validate demo HTTP MCP image
        run: docker build -f deploy/docker/Dockerfile.mcp -t mcp-runtime-example:ci .
      - name: Validate Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/mcp-runtime-lab
