apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-runtime-lab
  namespace: {{ include "mcp-runtime-lab.namespace" . }}
rules:
  - apiGroups: ['apps']
    resources: ['deployments','deployments/scale']
    verbs: ['get','list','create','patch','delete']
  - apiGroups: ['']
    resources: ['services']
    verbs: ['get','list','create','patch','delete']
  - apiGroups: ['']
    resources: ['pods','pods/log']
    verbs: ['get','list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-runtime-lab
  namespace: {{ include "mcp-runtime-lab.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-lab
    namespace: {{ include "mcp-runtime-lab.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-runtime-lab
